name: topikgo_flutter
description: "TOPIK learning app - Flutter version"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^14.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # Audio
  audioplayers: ^6.0.0
  
  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  html_unescape: ^2.0.0
  flutter_widget_from_html_core: ^0.15.1
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/images/
